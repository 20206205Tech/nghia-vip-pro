# Chạy tay để xem Project ID (project ref) và URL các project Supabase.
# Chỉ đọc `terraform output` từ state trên Terraform Cloud, không plan/apply.
name: supabase-ids

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-ids:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./code/infra/terraform/supabase

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      # Lấy TF_API_TOKEN để đọc state trên Terraform Cloud
      - name: Load needed secrets from Doppler
        working-directory: ${{ github.workspace }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: bash scripts/infra/terraform/doppler-tf-env.sh "code/infra/terraform/supabase"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Show Supabase project IDs
        run: |
          refs=$(terraform output -json project_refs)
          {
            echo "## Supabase project IDs"
            echo
            echo "| Môi trường | Project ID | URL |"
            echo "|---|---|---|"
            echo "$refs" | jq -r 'to_entries[] | "| \(.key) | `\(.value)` | https://\(.value).supabase.co |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
