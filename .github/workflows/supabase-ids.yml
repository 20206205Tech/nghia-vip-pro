# Xem Project ID (project ref) các project Supabase và gọi endpoint auth của từng project.
# - Chạy tay (workflow_dispatch) hoặc tự chạy mỗi ngày 07:00 giờ Việt Nam (schedule)
#   để project Supabase Free có hoạt động, tránh bị tạm dừng.
# - Chỉ đọc `terraform output` từ state trên Terraform Cloud, không plan/apply.
name: supabase-ids

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 07:00 giờ Việt Nam

permissions:
  contents: read

jobs:
  supabase-ids:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./code/infra/terraform/supabase

    env:
      TF_IN_AUTOMATION: "true"
      AUTH_REDIRECT_TO: https://20206205tech.github.io/auth-callback

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      # Lấy TF_API_TOKEN để đọc state trên Terraform Cloud
      - name: Load needed secrets from Doppler
        working-directory: ${{ github.workspace }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: bash scripts/infra/terraform/doppler-tf-env.sh "code/infra/terraform/supabase"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Show Supabase project IDs
        run: |
          terraform output -json project_refs > "$RUNNER_TEMP/project_refs.json"
          {
            echo "## Supabase project IDs"
            echo
            echo "| Môi trường | Project ID | URL |"
            echo "|---|---|---|"
            jq -r 'to_entries[] | "| \(.key) | `\(.value)` | https://\(.value).supabase.co |"' "$RUNNER_TEMP/project_refs.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Gọi /auth/v1/authorize (Google) của từng project, không theo redirect.
      # Project hoạt động bình thường trả về 302; mã khác thì job fail.
      - name: Ping Supabase auth
        run: |
          failed=0
          {
            echo
            echo "## Ping /auth/v1/authorize"
            echo
            echo "| Môi trường | HTTP |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r env ref; do
            url="https://${ref}.supabase.co/auth/v1/authorize?provider=google&redirect_to=${AUTH_REDIRECT_TO}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            echo "$env $ref -> $code"
            echo "| $env | $code |" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "302" ] || { echo "::error::$env ($ref) trả về $code"; failed=1; }
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' "$RUNNER_TEMP/project_refs.json")
          exit $failed
