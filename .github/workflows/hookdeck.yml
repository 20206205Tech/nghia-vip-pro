name: hookdeck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "code/infra/terraform/hookdeck/**"
      - ".github/workflows/hookdeck.yml"
      - ".github/workflows/terraform.yml"
      - "scripts/terraform/**"
  pull_request:
    branches: [main]
    paths:
      - "code/infra/terraform/hookdeck/**"
      - ".github/workflows/hookdeck.yml"
      - ".github/workflows/terraform.yml"
      - "scripts/terraform/**"

# Cần quyền ghi PR để in kết quả terraform plan
permissions:
  contents: read
  pull-requests: write

jobs:
  hookdeck:
    uses: ./.github/workflows/terraform.yml
    with:
      module: hookdeck
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
