# Workflow dùng chung cho mọi module trong code/infra/terraform/<module>
# Các workflow module chỉ cần gọi: uses: ./.github/workflows/terraform.yml
name: terraform

on:
  workflow_call:
    inputs:
      module:
        description: Tên thư mục trong code/infra/terraform
        required: true
        type: string
    secrets:
      DOPPLER_TOKEN:
        required: true

jobs:
  terraform:
    name: ${{ inputs.module }}
    # xxxx chỉ là mẫu để copy, không chạy terraform
    if: inputs.module != 'xxxx'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: terraform-${{ inputs.module }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./code/infra/terraform/${{ inputs.module }}

    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Terraform Plugin Cache Dir
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.module }}-${{ hashFiles(format('code/infra/terraform/{0}/versions.tf', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.module }}-

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load needed secrets from Doppler
        working-directory: ${{ github.workspace }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: bash scripts/doppler-tf-env.sh "code/infra/terraform/${{ inputs.module }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      # Lưu plan ra file: plan.txt để comment lên PR, tfplan để apply đúng plan đã xem
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Comment plan lên Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          MODULE: ${{ inputs.module }}
          PLAN_FILE: code/infra/terraform/${{ inputs.module }}/plan.txt
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { MODULE, PLAN_FILE, FMT_OUTCOME, PLAN_OUTCOME } = process.env;
            const icon = (o) => (o === 'success' ? '✅' : '❌');

            let plan = fs.existsSync(PLAN_FILE) ? fs.readFileSync(PLAN_FILE, 'utf8') : '(không có output)';
            const MAX = 60000;
            if (plan.length > MAX) plan = '...(đã cắt bớt, xem log đầy đủ trong Actions)\n' + plan.slice(-MAX);

            const summary = plan.match(/^(Plan: .*|No changes\..*)$/m)?.[0] ?? '';
            const marker = `<!-- terraform-plan:${MODULE} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform \`${MODULE}\``,
              '',
              `| Bước | Kết quả |`,
              `|---|---|`,
              `| fmt | ${icon(FMT_OUTCOME)} ${FMT_OUTCOME} |`,
              `| plan | ${icon(PLAN_OUTCOME)} ${PLAN_OUTCOME} |`,
              '',
              summary && `**${summary}**`,
              '',
              '<details><summary>Xem plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
              '',
              `Commit \`${context.sha.slice(0, 7)}\` · [Xem log](${runUrl})`,
            ].join('\n');

            // Cập nhật comment cũ của module này thay vì tạo comment mới mỗi lần push
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const old = comments.find((c) => c.body?.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Dừng nếu fmt hoặc plan lỗi
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "fmt=${{ steps.fmt.outcome }} plan=${{ steps.plan.outcome }}"
          exit 1

      # Chỉ apply khi push lên main, dùng đúng file plan vừa tạo
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false tfplan
