# Workflow dùng chung cho mọi module trong code/infra/terraform/<module>
# Các workflow module chỉ cần gọi: uses: ./.github/workflows/terraform.yml
name: terraform

on:
  workflow_call:
    inputs:
      module:
        description: Tên thư mục trong code/infra/terraform
        required: true
        type: string
    secrets:
      DOPPLER_TOKEN:
        required: true

jobs:
  terraform:
    name: ${{ inputs.module }}
    # xxxx chỉ là mẫu để copy, không chạy terraform
    if: inputs.module != 'xxxx'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: terraform-${{ inputs.module }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./code/infra/terraform/${{ inputs.module }}

    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create Terraform Plugin Cache Dir
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      - name: Cache Terraform Providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.module }}-${{ hashFiles(format('code/infra/terraform/{0}/versions.tf', inputs.module)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.module }}-

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Load needed secrets from Doppler
        working-directory: ${{ github.workspace }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: bash scripts/terraform/doppler-tf-env.sh "code/infra/terraform/${{ inputs.module }}"

      # Plan/apply chạy trên runner với biến từ Doppler, Terraform Cloud chỉ lưu state
      - name: Ensure Terraform Cloud workspace is Local
        working-directory: ${{ github.workspace }}
        run: bash scripts/terraform/tfc-ensure-local.sh "code/infra/terraform/${{ inputs.module }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      # Wrapper của setup-terraform giữ output trong steps.plan.outputs.stdout, không cần ghi file
      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: terraform plan -input=false -no-color

      - name: In kết quả plan lên Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          MODULE: ${{ inputs.module }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
        with:
          script: |
            const { MODULE, PLAN_OUTCOME, PLAN_STDOUT, PLAN_STDERR } = process.env;
            let plan = [PLAN_STDOUT, PLAN_STDERR].filter(Boolean).join('\n') || '(không có output)';
            const MAX = 60000;
            if (plan.length > MAX) plan = '...(đã cắt bớt, xem log đầy đủ trong Actions)\n' + plan.slice(-MAX);

            const summary = plan.match(/^(Plan: .*|No changes\..*)$/m)?.[0] ?? '';
            const marker = `<!-- terraform-plan:${MODULE} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform plan \`${MODULE}\`: ${PLAN_OUTCOME === 'success' ? '✅' : '❌'} ${PLAN_OUTCOME}`,
              '',
              summary && `**${summary}**`,
              '',
              '<details><summary>Xem plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
              '',
              `Commit \`${context.sha.slice(0, 7)}\` · [Xem log](${runUrl})`,
            ].join('\n');

            // Sửa comment cũ của module này thay vì tạo comment mới mỗi lần push
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const old = comments.find((c) => c.body?.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Dừng nếu plan lỗi
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve -input=false
