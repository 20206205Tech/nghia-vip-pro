name: terraform-hookdeck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "code/infra/terraform/hookdeck/**"
      - ".github/workflows/terraform-hookdeck.yml"
      - ".github/workflows/terraform.yml"
      - "scripts/infra/terraform/**"
  pull_request:
    branches: [dev, stg, main]
    paths:
      - "code/infra/terraform/hookdeck/**"
      - ".github/workflows/terraform-hookdeck.yml"
      - ".github/workflows/terraform.yml"
      - "scripts/infra/terraform/**"

permissions:
  contents: read

jobs:
  hookdeck:
    uses: ./.github/workflows/terraform.yml
    with:
      module: hookdeck
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
