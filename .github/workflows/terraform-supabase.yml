name: terraform-supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "code/infra/terraform/supabase/**"
      - ".github/workflows/terraform-supabase.yml"
      - ".github/workflows/terraform.yml"
      - "scripts/infra/terraform/**"
  pull_request:
    branches: [dev, stg, main]
    paths:
      - "code/infra/terraform/supabase/**"
      - ".github/workflows/terraform-supabase.yml"
      - ".github/workflows/terraform.yml"
      - "scripts/infra/terraform/**"

permissions:
  contents: read

jobs:
  supabase:
    uses: ./.github/workflows/terraform.yml
    with:
      module: supabase
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
